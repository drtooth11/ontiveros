name: Diagnostico temporal bloqueo robots
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Quién bloquea a Cookiebot
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re
          def get(path, ua):
              try:
                  r = urllib.request.urlopen(urllib.request.Request("https://clinicadentalontiveros.es" + path, headers={"User-Agent": ua}), timeout=30)
                  return r.status, dict(r.headers), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read().decode("utf-8", "replace")
          c, h, b = get("/", "Cookiebot")
          print(f"::notice::Cookiebot / -> {c}; cabeceras: " + "; ".join(f"{k}={v}" for k, v in h.items() if k.lower() in ("server","x-powered-by","x-imunify","x-litespeed-cache","x-turbo-charged-by","content-type")))
          texto = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", b)).strip()
          print(f"::notice::Texto de la página 403: {texto[:400]}")
          for p in ("/robots.txt", "/img/2023/03/logo.webp", "/assets/styles.css", "/sitemap.xml"):
              c2, _, _ = get(p, "Cookiebot")
              print(f"::notice::Cookiebot {p} -> {c2}")
          c3, h3, _ = get("/", "Mozilla/5.0 Chrome/130.0")
          print(f"::notice::Navegador / -> {c3}; server={h3.get('Server')}")
          PY
