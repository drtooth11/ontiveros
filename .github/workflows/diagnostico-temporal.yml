name: Diagnostico temporal portada
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Qué recibe un robot al pedir la portada
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, time
          UAS = {"Cookiebot": "Cookiebot",
                 "CookiebotScanner": "CookiebotScanner/2.0",
                 "compatible+bot": "Mozilla/5.0 (compatible; SomeBot/1.0)",
                 "cookiebot.com url": "Mozilla/5.0 (+https://www.cookiebot.com)",
                 "Googlebot falso": "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)",
                 "Chrome+Cookiebot": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36 Cookiebot",
                 "curl": "curl/8.5.0",
                 "vacío": ""}
          for i in range(1):
              for n, ua in UAS.items():
                  try:
                      r = urllib.request.urlopen(urllib.request.Request("https://clinicadentalontiveros.es/", headers={"User-Agent": ua}), timeout=30)
                      c, b = r.status, r.read().decode("utf-8", "replace")
                  except urllib.error.HTTPError as e:
                      c, b = e.code, e.read().decode("utf-8", "replace")
                  t = re.search(r"<title>(.*?)</title>", b, re.S)
                  cb = "uc.js" in b and "fc7c8d8f" in b
                  print(f"::notice::{n}: HTTP {c}, {len(b)} bytes, título={t.group(1).strip()[:60] if t else '-'!r}, script Cookiebot={'SÍ' if cb else 'NO'}")
              time.sleep(5)
          PY
